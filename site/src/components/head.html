<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}}</title>

<!-- Primary Meta Tags -->
<meta name="title" content="{{metaTitle}}" />
<meta name="description" content="{{description}}" />
<meta name="keywords"
  content="kod, self-hosted git, git platform, git workflows, CI/CD, trunk-based development, self-hosted, git repositories, developer tools, minimal git, lightweight git server" />
<meta name="robots" content="index, follow" />
<meta name="language" content="English" />
<meta name="author" content="Mikael Vesavuori" />

<!-- Canonical URL -->
<link rel="canonical" href="{{canonicalUrl}}" />

<!-- Preload Assets -->
<link rel="preload" href="fonts/InterVariable.woff2?v=4.1" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InterVariable-Italic.woff2?v=4.1" as="font" type="font/woff2" crossorigin>

<!-- Theme Color -->
<meta name="theme-color" content="#1618cc" />
<meta name="msapplication-TileColor" content="#1618cc" />

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="shortcut icon" href="/icons/favicon.ico" />

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
<link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

<!-- Apple Mobile Web App -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kod" />

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ogUrl}}" />
<meta property="og:title" content="{{ogTitle}}" />
<meta property="og:description" content="{{ogDescription}}" />
<meta property="og:image" content="{{ogImage}}" />
<meta property="og:image:width" content="1300" />
<meta property="og:image:height" content="700" />

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="{{twitterUrl}}" />
<meta property="twitter:title" content="{{twitterTitle}}" />
<meta property="twitter:description" content="{{twitterDescription}}" />
<meta property="twitter:image" content="{{twitterImage}}" />

<!-- Structured Data -->
<slot />

<!-- Styles -->
<link rel="stylesheet" href="styles/styles.css" />
